services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # ホスト側は5433。5432は既存の別コンテナと衝突する可能性があるため
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app/server
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - ./app/server:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432
      RAILS_ENV: development
      FRONTEND_ORIGIN: http://localhost:3001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEYが未設定です。リポジトリ直下に.envを作成し ANTHROPIC_API_KEY=sk-ant-... を書いてください}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEYが未設定です。リポジトリ直下の.envに OPENAI_API_KEY=sk-... を書いてください(Whisper文字起こし用)}
      # 音声クローン(結果画面の音声煽り)はおまけ機能のため、未設定でもアプリ全体は起動できるようにしている
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  db_data:
  bundle_cache:
